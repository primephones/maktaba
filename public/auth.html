<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maktaba · signing in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f6f4ef; color: #1d1c1a; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #1d1914; color: #efe3cb; } a { color: #eb8a79; } }
  a { color: #a3302a; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p id="msg">Returning to Maktaba…</p>
  <p><a id="back" href="#">Open Maktaba</a></p>
</main>
<script>
  // Hands a finished sign-in back to where it started: the Android app (maktaba://auth)
  // or the web app beside this page.
  (function () {
    var q = location.search.replace(/^\?/, '');
    var params = new URLSearchParams(q);
    params.delete('app');
    var rest = params.toString();
    var fromApp = /(^|&)app=1(&|$)/.test(q);
    var target = fromApp ? 'maktaba://auth?' + rest : './?' + rest + '#/settings/ai';
    document.getElementById('back').href = target;
    location.replace(target);
    if (fromApp) {
      setTimeout(function () {
        document.getElementById('msg').textContent = 'Signed in. If Maktaba did not open by itself, tap below.';
      }, 1500);
    }
  })();
</script>
</body>
</html>

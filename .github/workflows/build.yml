name: Build and test

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Let a run finish (the phone test takes a while); the newest push waits its turn.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  web:
    name: Web app and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # The app's Google sign-in ID for the web (a repository variable, not a secret:
          # it is public by design). Without it the web app offers no Google Drive sign-in.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Install the test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Make the test books
        run: node e2e/fixtures.mjs
      - name: Run the app end to end in a phone-sized browser
        run: npm run e2e
      - name: Check every screen is readable in every theme
        run: npm run e2e:themes
      - name: Check the motion (opening books, going back, dragging sheets)
        run: node e2e/motion.mjs
      - name: Test the private server
        working-directory: server
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          WRANGLER_SEND_METRICS=false node test/live.mjs
      - name: Use the reader's own AI, with no server
        run: node e2e/myai.mjs
      - name: Two phones in step through the reader's own Drive
        run: node e2e/cloud.mjs
      - name: The setup guide, as someone new meets it
        run: node e2e/setup.mjs
      - name: Urdu and Persian on every screen, at three screen sizes
        run: node e2e/look-urdu.mjs
      - name: Translate a whole book through the server, in the app
        run: WRANGLER_SEND_METRICS=false node e2e/ai.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-screenshots
          path: |
            e2e/out/shots
            e2e/out/themes
            e2e/out/motion
            e2e/out/urdu
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: test-books
          path: e2e/out/fixtures

  pages:
    name: Publish the web app (the link to share)
    needs: web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Until GitHub Pages is switched on for the repository this step cannot publish; that
    # must not mark the whole build as failed.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: npx cap sync android
      - name: Use the signing key, if one has been stored
        env:
          KEYSTORE_B64: ${{ secrets.MAKTABA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maktaba.keystore"
            echo "MAKTABA_KEYSTORE=$RUNNER_TEMP/maktaba.keystore" >> "$GITHUB_ENV"
            echo "Signed with the stored key: this build installs over earlier ones."
          else
            echo "::warning::No signing key stored. This is a test build and cannot update an earlier install."
          fi
      - name: Build the APK
        env:
          MAKTABA_KEYSTORE_PASSWORD: ${{ secrets.MAKTABA_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd android
          # Downloads can be refused for a while when a package server is busy: try again.
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }} -PappVersion=$VERSION && break
            [ $attempt = 3 ] && exit 1
            echo "Build attempt $attempt failed; retrying in $((attempt * 60)) seconds"
            sleep $((attempt * 60))
          done
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Maktaba-$VERSION-build${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: maktaba-apk
          path: Maktaba-*.apk

  phone:
    name: Test on an Android phone (emulator)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: maktaba-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: test-books
          path: e2e/out/fixtures
      - name: Install the test driver
        run: |
          npm install --no-save playwright
          pip install --quiet pillow
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maktaba on the phone and use it
        id: phone1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            mkdir -p e2e/out/phone
            adb logcat -c || true
            (adb logcat -v time > e2e/out/phone/logcat.txt 2>&1 &)
            adb install -r apk/*.apk
            timeout 900 node e2e/android.mjs
      # The emulator on shared machines sometimes dies by itself; a second, fresh one decides.
      # The Android 14 emulator has gone offline the moment the app shows its background-work
      # notification. The retry draws the screen inside the emulator (-gpu guest) instead of
      # through the host's graphics emulation. (Android 12's image is no use: its 2021
      # browser engine is too old for the test driver.)
      - name: Try again with the emulator drawing in software, if the first one failed
        id: phone2
        if: steps.phone1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            mkdir -p e2e/out/phone
            adb logcat -c || true
            (adb logcat -v time > e2e/out/phone/logcat.txt 2>&1 &)
            adb install -r apk/*.apk
            timeout 900 node e2e/android.mjs
      - name: Phone test result
        if: steps.phone1.outcome == 'failure' && steps.phone2.outcome != 'success'
        run: |
          echo "::error::The app failed on both emulator runs."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: e2e/out/phone
          if-no-files-found: ignore

  release:
    name: Publish the APK
    needs: [apk, phone]
    if: always() && needs.apk.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maktaba-apk
          path: apk
      - name: Publish as a test build
        env:
          GH_TOKEN: ${{ github.token }}
          PHONE: ${{ needs.phone.result }}
        run: |
          APK=$(ls apk/*.apk)
          if [ "$PHONE" = "success" ]; then TESTED="Passed the automated test on an Android emulator."; else TESTED="Browser tests passed; the automated Android emulator test did not pass for this build ($PHONE)."; fi
          printf '%s\n\n%s\n' "$TESTED" "Install: open this page on your phone, tap the .apk below, then Install. On a Samsung phone, first switch off Settings > Security and privacy > Auto Blocker; you can switch it back on afterwards." > notes.md
          gh release create "build-${{ github.run_number }}" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Maktaba test build ${{ github.run_number }}" \
            --notes-file notes.md
